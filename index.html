<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>赛博手势粒子 · NEBULA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230f1a2c' stroke='%2335f0ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23ff3df0'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./css/style.css" />
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js" } }
</script>
</head>
<body>

<canvas id="stage"></canvas>
<div id="vignette"></div>
<div id="scan"></div>
<video id="cam" playsinline muted autoplay></video>

<header id="hud">
  <div class="brand">
    <span class="logo"></span>
    <div class="txt">
      <h1>赛博手势粒子</h1>
      <p>NEBULA · 手势交互粒子装置</p>
    </div>
  </div>
  <div class="stats">
    <span class="dot" id="camDot"></span><span id="camText">摄像头未开启</span>
    <span class="sep"></span><span id="fpsText">-- FPS</span>
    <span class="sep"></span><span id="countText">-- 粒子</span>
    <span class="sep"></span><span id="resText">--</span>
  </div>
  <div class="roles">
    <span class="role" id="roleLBox"><i></i>左手 · <b id="roleL">调色</b></span>
    <span class="role" id="roleRBox"><i></i>右手 · <b id="roleR">塑形</b></span>
    <span class="role wide">手势 · <b id="gestureText">等待识别</b></span>
  </div>
</header>

<aside id="panel">
  <div class="panelHead">
    <span>控制台</span>
    <button id="collapse" title="收起 / 展开 (Tab)">−</button>
  </div>
  <div class="panelBody">

    <div class="row">
      <button id="btnCam" class="btn primary">开启摄像头</button>
      <button id="btnDemo" class="btn ghost">演示模式</button>
    </div>

    <label class="slider">
      <span>粒子密度 <b id="vDensity">8000</b></span>
      <input id="density" type="range" min="800" max="26000" step="200" value="8000" />
    </label>
    <label class="slider">
      <span>拖尾长度 <b id="vTrail">0.55</b></span>
      <input id="trail" type="range" min="0" max="1" step="0.01" value="0.55" />
    </label>
    <label class="slider">
      <span>光晕强度 <b id="vGlow">1.00</b></span>
      <input id="glow" type="range" min="0.3" max="2.2" step="0.05" value="1" />
    </label>
    <label class="slider">
      <span>色相基准 <b id="vHue">188</b>°</span>
      <input id="hue" type="range" min="0" max="360" step="1" value="188" />
    </label>
    <label class="slider">
      <span>星空亮度 <b id="vStar">1.00</b></span>
      <input id="star" type="range" min="0" max="2" step="0.05" value="1" />
    </label>

    <div class="row wrap">
      <label class="chk"><input type="checkbox" id="autoQuality" checked /><i></i>自动降级</label>
      <label class="chk"><input type="checkbox" id="showPreview" checked /><i></i>摄像头预览</label>
      <label class="chk"><input type="checkbox" id="autoHue" checked /><i></i>自动换色</label>
    </div>

    <div class="row">
      <button id="btnGif" class="btn accent">导出 GIF</button>
      <button id="btnFull" class="btn ghost">全屏</button>
    </div>

    <p class="note">左手指向哪边 → 色相往哪边走；右手手掌位置决定形态中心，手指张合决定大小。</p>
  </div>
</aside>

<div id="legend">
  <div class="item"><span class="glyph">🫶</span><span class="t"><b>比心</b><em>爱心粒子流</em></span></div>
  <div class="item"><span class="glyph">✌️</span><span class="t"><b>比耶</b><em>弹出 Hello</em></span></div>
  <div class="item"><span class="glyph">🤏</span><span class="t"><b>捏合</b><em>粒子爆炸</em></span></div>
</div>

<div id="preview" class="on">
  <canvas id="previewCanvas" width="256" height="192"></canvas>
  <span>摄像头预览</span>
</div>

<div id="tips">空格 爆炸 · 1 比心 · 2 比耶 · 3 捏合 · Tab 隐藏界面 · F 全屏</div>

<div id="toast">
  <div id="toastText">导出中…</div>
  <div class="bar"><i id="toastBar"></i></div>
</div>

<div id="boot">
  <div class="ring"></div>
  <p>正在点亮星云…</p>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
